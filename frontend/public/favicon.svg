<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="favBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>
    
    <linearGradient id="favShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Speech Bubble Circle + Tail -->
  <path d="M 75 10 C 39.1 10 10 39.1 10 75 C 10 93.6 17.8 110.4 30.4 122.3 C 27.5 133 21 142.5 12 147.5 C 26 148.5 40 142.5 50.5 135 C 58.2 138.2 66.4 140 75 140 C 110.9 140 140 110.9 140 75 C 140 39.1 110.9 10 75 10 Z" fill="url(#favBubble)"/>
  
  <!-- Shield Outer Outline -->
  <path d="M 75 30 C 93 34 106 37 111 39 C 111 76 99 100 75 117 C 51 100 39 76 39 39 C 44 37 57 34 75 30 Z" fill="#042F2C" fill-opacity="0.35" stroke="url(#favShield)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bar Chart Columns inside Shield -->
  <rect x="57" y="72" width="6" height="15" rx="2" fill="#34D399" opacity="0.7"/>
  <rect x="67" y="64" width="6" height="23" rx="2" fill="#34D399" opacity="0.7"/>
  <rect x="77" y="58" width="6" height="29" rx="2" fill="#34D399" opacity="0.7"/>

  <!-- Dollar Sign ($) inside Shield Top -->
  <text x="75" y="52" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">$</text>

  <!-- Upward Trend Line / Arrow (↗) -->
  <path d="M 44 91 L 67 76 L 80 84 L 109 50" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 109 50 L 95 52 M 109 50 L 107 65" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Checkmark inside Shield Bottom Right -->
  <path d="M 91 83 L 96 88 L 104 77" stroke="#34D399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
